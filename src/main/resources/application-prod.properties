# En producción nunca exponemos la consola H2 ni las consultas SQL en logs
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Permite inyectar otra BD (ej. PostgreSQL) por variables de entorno si la usas
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/geolocalizadordb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}