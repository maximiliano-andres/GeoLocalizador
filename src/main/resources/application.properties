spring.application.name=geolocalizador
server.port=8080

# Carga automáticamente variables desde .env si existe en la raíz del proyecto
spring.config.import=optional:file:.env[.properties]

# URL pública opcional para los enlaces enviados por correo (ej. https://tu-tunel.trycloudflare.com)
# Si se deja vacío, se usa automáticamente la URL de la petición actual (http://localhost:8080)
app.base-url=${APP_BASE_URL:}

# Base de datos H2 persistente en archivo local (conserva enlaces al reiniciar con DevTools)
spring.datasource.url=jdbc:h2:file:./data/geolocalizadordb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración SMTP de Gmail (usar variables de entorno para no guardar credenciales en el código)
# IMPORTANTE: MAIL_PASSWORD debe ser una "Contraseña de aplicación" (App Password) de Google, no tu clave normal.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
